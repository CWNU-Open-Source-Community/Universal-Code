protocol: project_config.v1
read_only: false
allowed_profiles: [code, review]
budget:
  max_turns: 20
  max_tool_calls: 10
browser_limits:
  max_origins: 4
  max_requests: 200
  timeout_ms: 180000
exclude_paths:
  - fixtures
  - "secrets/**"
skill_suggestions:
  - code@1.3.0
test_command_id: test.go
format_command_id: format.go
# Optional: review this exact configuration in Checks and delivery to enable.
hooks:
  after_edit_format: true
  before_finish_test: true
