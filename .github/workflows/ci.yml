name: Fixed PowerShell diagnosis

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-fixed-powershell-diagnostic:
    name: Windows fixed PowerShell diagnosis
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true
      - name: Build read-only managed stack sampler
        shell: pwsh
        run: dotnet publish scripts/fixed-stack/FixedStack.csproj -c Release -o "$env:RUNNER_TEMP\fixed-stack"
      - name: Diagnose original fixed command and script phases
        shell: pwsh
        run: |
          $env:TRAVERSE_FIXED_STACK_HELPER = Join-Path $env:RUNNER_TEMP 'fixed-stack\FixedStack.exe'
          python scripts/diagnose-fixed-powershell.py
