name: Fixed PowerShell diagnosis

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-fixed-powershell-diagnostic:
    name: Windows fixed PowerShell diagnosis
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true
      - name: Diagnose original fixed command and script phases
        shell: pwsh
        run: python scripts/diagnose-fixed-powershell.py
