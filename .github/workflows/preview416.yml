name: Preview for PR 416

on:
  push:
    branches: [Qiyuanqiii/preview416-build]
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_REVISION: 644fc15f032c661fbbbec41c2eaaf31acce6c53c
  MAIN_REVISION: 1694ea19b0945f9ba4286b3137f9e8132884a03e
  PREVIEW_VERSION: v1.0.0-preview.416.20261020
  CGO_ENABLED: '1'

jobs:
  native-preview:
    name: Preview (${{ matrix.platform }}-${{ matrix.arch }})
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: macos
            arch: arm64
            directory: build/macos-public
          - runner: macos-15-intel
            platform: macos
            arch: amd64
            directory: build/macos-public
          - runner: windows-latest
            platform: windows
            arch: amd64
            directory: build/windows-preview
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout the exact main plus PR 420 source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.SOURCE_REVISION }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify source identity and inclusion of main
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_REVISION"
          git merge-base --is-ancestor "$MAIN_REVISION" "$SOURCE_REVISION"
          test -z "$(git status --porcelain)"

      - name: Set up repository-pinned Go
        id: go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.16.0'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build the Mac renderer
        if: matrix.platform == 'macos'
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Build and verify the native Mac preview archive
        if: matrix.platform == 'macos'
        env:
          NATIVE_ARCH: ${{ matrix.arch }}
        run: bash scripts/release-desktop-darwin.sh "$PREVIEW_VERSION" "$SOURCE_REVISION" "$NATIVE_ARCH"

      - name: Prepare the fixed Windows Go installation
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          PINNED_GO_VERSION: ${{ steps.go.outputs.go-version }}
        run: ./scripts/prepare-windows-fixed-go.ps1 -ExpectedGoVersion $env:PINNED_GO_VERSION

      - name: Build and verify the Windows preview
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          TRAVERSE_BOARD_LOCAL_SANDBOX_TEST_HOST_PREP: '1'
        run: |
          ./scripts/build-desktop.ps1 -Version $env:PREVIEW_VERSION -VerifyReproducible
          go run ./cmd/releasegen --out build/desktop --version $env:PREVIEW_VERSION --tags desktop,production,wv2runtime.error
          if ($LASTEXITCODE -ne 0) { throw "Preview SBOM generation failed" }
          ./scripts/stage-direct-exe.ps1 -Channel prerelease -ExpectedVersion $env:PREVIEW_VERSION -ExpectedRevision $env:SOURCE_REVISION
          ./scripts/stage-direct-exe.ps1 -VerifyOnly -ExpectedVersion $env:PREVIEW_VERSION -ExpectedRevision $env:SOURCE_REVISION
          ./scripts/smoke-desktop-operator-preview.ps1 -BinaryPath build/desktop/TraverseBoard.exe
          $metadata = Get-Content -LiteralPath build/desktop/release-metadata.json -Raw | ConvertFrom-Json
          if ($metadata.modified -or $metadata.target_arch -cne "amd64" -or $metadata.target_os -cne "windows") {
            throw "Preview source or native architecture does not match"
          }
          New-Item -ItemType Directory -Path build/windows-preview -Force | Out-Null
          Copy-Item -LiteralPath build/desktop/TraverseBoard.direct.exe -Destination build/windows-preview/TraverseBoard.exe
          foreach ($name in @("release-metadata.json", "direct-exe-signing.json", "SHA256SUMS", "sbom.json", "NOTICE", "LOCAL-TEST-GUIDE.txt", "windows-compatibility.json")) {
            Copy-Item -LiteralPath (Join-Path build/desktop $name) -Destination build/windows-preview
          }

      - name: Record the preview source and build
        shell: pwsh
        env:
          PREVIEW_PLATFORM: ${{ matrix.platform }}
          PREVIEW_ARCH: ${{ matrix.arch }}
          PREVIEW_DIRECTORY: ${{ matrix.directory }}
          WORKFLOW_REVISION: ${{ github.sha }}
        run: |
          $source = [ordered]@{
            version = $env:PREVIEW_VERSION
            source_revision = $env:SOURCE_REVISION
            included_main_revision = $env:MAIN_REVISION
            included_pull_request = 420
            platform = $env:PREVIEW_PLATFORM
            architecture = $env:PREVIEW_ARCH
            workflow_revision = $env:WORKFLOW_REVISION
            build_url = "https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
            signing = $(if ($env:PREVIEW_PLATFORM -eq "macos") { "ad-hoc; not notarized" } else { "unsigned" })
            preview_only = $true
          }
          $source | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $env:PREVIEW_DIRECTORY preview-source.json) -Encoding utf8
          "Source: $env:SOURCE_REVISION (main + PR #420)" >> $env:GITHUB_STEP_SUMMARY
          "Platform: $env:PREVIEW_PLATFORM / $env:PREVIEW_ARCH" >> $env:GITHUB_STEP_SUMMARY

      - name: Upload the preview and verification records
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: TraverseBoard-preview-${{ matrix.platform }}-${{ matrix.arch }}-644fc15f
          path: ${{ matrix.directory }}/*
          if-no-files-found: error
          retention-days: 30
