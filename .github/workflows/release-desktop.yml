name: Desktop release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Desktop release version (for example v1.0.0-rc.1)
        required: true
        default: v1.0.0-rc.1
        type: string
      phase:
        description: Prepare a stable signing request, or finalize a release candidate
        required: true
        default: finalize
        type: choice
        options:
          - prepare
          - finalize
  pull_request:
    paths:
      # Product/dependency changes are checked by central CI. PR packaging
      # validates changes to the release machinery and distribution inputs.
      - '.github/workflows/release-desktop.yml'
      - 'scripts/check-download-docs.py'
      - 'scripts/test_download_docs.py'
      - 'cmd/packagede2e/**'
      - 'cmd/producte2e/**'
      - 'cmd/releasegate/**'
      - 'cmd/releasegen/**'
      - 'internal/packagede2e/**'
      - 'internal/producte2e/**'
      - 'internal/releasegate/**'
      - 'scripts/build-desktop-darwin.sh'
      - 'scripts/build-embedded-wasi.sh'
      - 'scripts/check-macos-compat.sh'
      - 'scripts/release-desktop-darwin.sh'
      - 'scripts/macos-release.py'
      - 'scripts/package-desktop-dmg.py'
      - 'scripts/test_macos_dmg.py'
      - 'scripts/test_macos_release.py'
      - 'scripts/build-desktop.ps1'
      - 'scripts/check-windows-compat.ps1'
      - 'scripts/finalize-windows-release.ps1'
      - 'scripts/generate-brand-assets.ps1'
      - 'scripts/windows-visual-assets.ps1'
      - 'scripts/package-msix.ps1'
      - 'scripts/package-portable-zip.ps1'
      - 'scripts/release-desktop.ps1'
      - 'scripts/stage-direct-exe.ps1'
      - 'scripts/smoke-desktop-operator-preview.ps1'
      - 'scripts/standard-code-packaged-e2e.ps1'
      - 'scripts/standard-code-product-e2e.ps1'
      - 'scripts/test-standard-code-packaged-readiness.ps1'
      - 'scripts/verify-portable-zip.ps1'
      - 'scripts/verify-msix.ps1'
      - 'packaging/windows/**'
      - 'packaging/macos/**'
      - 'assets/branding/**'
  push:
    tags:
      - 'v*'

permissions:
  actions: read
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dependency-boundaries:
    name: Release dependency and license boundaries
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      msix_version: ${{ steps.release.outputs.msix_version }}
      revision: ${{ steps.release.outputs.revision }}
      artifact_name: ${{ steps.release.outputs.artifact_name }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      phase: ${{ steps.release.outputs.phase }}
      signing_prepare: ${{ steps.release.outputs.signing_prepare }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Resolve and validate release identity
        id: release
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PHASE: ${{ inputs.phase }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if ($env:EVENT_NAME -eq "push") {
            if ($env:REF_TYPE -ne "tag") { throw "Release pushes must be tags" }
            $version = $env:REF_NAME
            $phase = "finalize"
          } elseif ($env:EVENT_NAME -eq "workflow_dispatch") {
            $version = $env:INPUT_VERSION
            $phase = $env:INPUT_PHASE
            if ($phase -cnotin @("prepare", "finalize")) {
              throw "Desktop release phase is invalid"
            }
          } elseif ($env:EVENT_NAME -eq "pull_request") {
            if ($env:PR_NUMBER -notmatch '^[1-9][0-9]*$') { throw "Pull request number is invalid" }
            $version = "v1.0.0-pr.$($env:PR_NUMBER)"
            $phase = "validate"
          } else {
            throw "Unsupported Desktop release event"
          }
          if ($version -notmatch '^v(?<major>[0-9]+)\.(?<minor>[0-9]+)\.(?<patch>[0-9]+)(?:(?<prerelease>-[0-9A-Za-z.-]+)|(?<build>\+[0-9A-Za-z.-]+))?$') {
            throw "Desktop release version is invalid"
          }
          $isPrerelease = -not [string]::IsNullOrEmpty([string]$Matches.prerelease)
          foreach ($part in @($Matches.major, $Matches.minor, $Matches.patch)) {
            if ([int64]$part -gt 65535) { throw "MSIX release version component is too large" }
          }
          $msixVersion = "$($Matches.major).$($Matches.minor).$($Matches.patch).0"
          $revision = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $revision -notmatch '^[0-9a-f]{40}$') {
            throw "Release revision is invalid"
          }
          if ($env:EVENT_NAME -ne "pull_request") {
            git merge-base --is-ancestor $revision origin/main
            if ($LASTEXITCODE -ne 0) { throw "Release revision is not reachable from origin/main" }
          }
          $artifactVersion = $version -replace '[^0-9A-Za-z._-]', '_'
          $signingPrepare = $env:EVENT_NAME -eq "workflow_dispatch" -and
            $phase -ceq "prepare" -and -not $isPrerelease
          if ($phase -ceq "prepare" -and $isPrerelease) {
            throw "The prepare phase is only valid for a stable signing request"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "msix_version=$msixVersion" >> $env:GITHUB_OUTPUT
          "revision=$revision" >> $env:GITHUB_OUTPUT
          "artifact_name=TraverseBoard-windows-release-$artifactVersion" >> $env:GITHUB_OUTPUT
          "prerelease=$($isPrerelease.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "phase=$phase" >> $env:GITHUB_OUTPUT
          "signing_prepare=$($signingPrepare.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Check public download documentation before release work
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          $arguments = @('-B', 'scripts/check-download-docs.py')
          if ($env:EVENT_NAME -ceq 'push') { $arguments += @('--version', $env:RELEASE_VERSION) }
          python @arguments
          if ($LASTEXITCODE -ne 0) { throw "Update both READMEs and platform download guides before publishing" }
          python -B -m unittest discover -s scripts -p test_download_docs.py -v
          if ($LASTEXITCODE -ne 0) { throw "Download documentation regression checks failed" }

      - name: Require successful full central CI for the exact release revision
        if: ${{ github.event_name != 'pull_request' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $revision = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $revision -notmatch '^[0-9a-f]{40}$') {
            throw "Release CI revision is invalid"
          }
          $endpoint = "repos/$env:GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" +
            "?head_sha=$revision&status=completed&per_page=100"
          $response = gh api $endpoint --paginate --slurp
          if ($LASTEXITCODE -ne 0) { throw "Central CI provenance lookup failed" }
          $pages = ($response | Out-String) | ConvertFrom-Json
          $successful = @($pages | ForEach-Object { $_.workflow_runs } | Where-Object {
              [string]$_.head_sha -ceq $revision -and
              [string]$_.event -cin @("push", "workflow_dispatch", "schedule") -and
              [string]$_.status -ceq "completed" -and
              [string]$_.conclusion -ceq "success"
            })
          $fullVerified = $false
          foreach ($run in $successful) {
            $runID = [string]$run.id
            $attempt = [string]$run.run_attempt
            if ($runID -notmatch '^[1-9][0-9]*$' -or $attempt -notmatch '^[1-9][0-9]*$') {
              throw "Central CI run or attempt identity is invalid"
            }
            # Partial runs can succeed. The full-only aggregate is successful
            # only after every full check passed in this same run attempt.
            $jobsEndpoint = "repos/$env:GITHUB_REPOSITORY/actions/runs/$runID" +
              "/attempts/$attempt/jobs?per_page=100"
            $jobResponse = gh api $jobsEndpoint --paginate --slurp
            if ($LASTEXITCODE -ne 0) { throw "Full central CI job lookup failed" }
            $jobPages = ($jobResponse | Out-String) | ConvertFrom-Json
            $fullJobs = @($jobPages | ForEach-Object { $_.jobs } | Where-Object {
                [string]$_.name -ceq "Full CI verification"
              })
            if ($fullJobs.Count -eq 1 -and
                [string]$fullJobs[0].run_id -ceq $runID -and
                [string]$fullJobs[0].head_sha -ceq $revision -and
                [string]$fullJobs[0].status -ceq "completed" -and
                [string]$fullJobs[0].conclusion -ceq "success") {
              $fullVerified = $true
              break
            }
          }
          if (-not $fullVerified) {
            throw "The exact release revision has no successful full central CI; run CI manually for this revision before releasing"
          }

      - name: Set up repository-pinned Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up pinned Node 24.22.1
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Verify Mac archive rejection cases
        run: python3 -B -m unittest discover -s scripts -p 'test_macos_*.py' -v

      - name: Verify Go module graph and checksums
        run: |
          go mod verify
          go mod tidy -diff

      - name: Verify Node lockfile
        working-directory: web
        run: npm ci --ignore-scripts

      - name: Update rustup certificate trust
        run: rustup self update
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal

      - name: Verify locked Rust graph and canonical embedded analyzer
        run: |
          cargo +1.97.1 metadata --locked --format-version 1 --manifest-path analyzers/Cargo.toml >/dev/null
          ./scripts/build-embedded-wasi.sh
          cmp --silent \
            analyzers/target/wasm32-wasip1/release/cyberagent-analyzer-fixture.wasm \
            internal/analyzer/embedded/cyberagent-analyzer-fixture.wasm

  macos-archive:
    name: macOS preview archive (${{ matrix.arch }})
    needs: dependency-boundaries
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: amd64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Require Mac distribution evidence for stable finalize
        if: ${{ needs.dependency-boundaries.outputs.prerelease == 'false' && needs.dependency-boundaries.outputs.phase == 'finalize' }}
        run: |
          echo 'Stable macOS publication requires Developer ID signing, notarization and final-package manual acceptance; this pipeline currently produces previews only.' >&2
          exit 1
      - name: Set up repository-pinned Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Set up pinned Node 24.22.1
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build embedded renderer
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Build archive and verify extracted native bundle
        env:
          RELEASE_VERSION: ${{ needs.dependency-boundaries.outputs.version }}
          RELEASE_REVISION: ${{ needs.dependency-boundaries.outputs.revision }}
          RELEASE_ARCH: ${{ matrix.arch }}
        run: bash scripts/release-desktop-darwin.sh "$RELEASE_VERSION" "$RELEASE_REVISION" "$RELEASE_ARCH"
      - name: Build and verify Mac preview disk image
        env:
          RELEASE_VERSION: ${{ needs.dependency-boundaries.outputs.version }}
          RELEASE_REVISION: ${{ needs.dependency-boundaries.outputs.revision }}
          RELEASE_ARCH: ${{ matrix.arch }}
        run: python3 scripts/package-desktop-dmg.py "$RELEASE_VERSION" "$RELEASE_REVISION" "$RELEASE_ARCH"
      - name: Upload exact Mac preview archive and verification sidecars
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: TraverseBoard-macos-${{ matrix.arch }}-${{ needs.dependency-boundaries.outputs.revision }}
          path: build/macos-public/*
          if-no-files-found: error
          retention-days: 30
      - name: Upload exact Mac preview disk image and checksum
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: TraverseBoard-macos-dmg-${{ matrix.arch }}-${{ needs.dependency-boundaries.outputs.revision }}
          path: build/macos-dmg/*
          if-no-files-found: error
          retention-days: 30

  portable-zip:
    name: Windows dual-product candidate
    needs: dependency-boundaries
    runs-on: windows-latest
    env:
      TRAVERSE_BOARD_LOCAL_SANDBOX_TEST_HOST_PREP: '1'
      STORE_PACKAGE_IDENTITY_NAME: ${{ vars.STORE_PACKAGE_IDENTITY_NAME }}
      STORE_PACKAGE_PUBLISHER: ${{ vars.STORE_PACKAGE_PUBLISHER }}
      STORE_PUBLISHER_DISPLAY_NAME: ${{ vars.STORE_PUBLISHER_DISPLAY_NAME }}
      STORE_PACKAGE_VERSION: ${{ vars.STORE_PACKAGE_VERSION }}
      DIRECT_EXE_SIGNER_SUBJECT: ${{ vars.DIRECT_EXE_SIGNER_SUBJECT }}
      DIRECT_EXE_SIGNER_THUMBPRINT: ${{ vars.DIRECT_EXE_SIGNER_THUMBPRINT }}
    outputs:
      version: ${{ needs.dependency-boundaries.outputs.version }}
      msix_version: ${{ needs.dependency-boundaries.outputs.msix_version }}
      revision: ${{ needs.dependency-boundaries.outputs.revision }}
      artifact_name: ${{ needs.dependency-boundaries.outputs.artifact_name }}
      prerelease: ${{ needs.dependency-boundaries.outputs.prerelease }}
      phase: ${{ needs.dependency-boundaries.outputs.phase }}
      signing_prepare: ${{ needs.dependency-boundaries.outputs.signing_prepare }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Verify shared release revision
        shell: pwsh
        env:
          RELEASE_REVISION: ${{ needs.dependency-boundaries.outputs.revision }}
        run: |
          if ((git rev-parse HEAD).Trim() -cne $env:RELEASE_REVISION) {
            throw "Windows source differs from shared release revision"
          }

      - name: Set up repository-pinned Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up pinned Node 24.22.1
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Update rustup certificate trust
        run: rustup self update
      - name: Install pinned Rust toolchain for the fixture oracle
        shell: pwsh
        run: rustup toolchain install 1.97.1 --profile minimal

      - name: Verify fail-closed Standard Code release-gate contract
        run: go test -count=1 ./cmd/releasegate ./internal/releasegate ./internal/producte2e ./internal/packagede2e

      - name: Reject stale-store and foreign-window startup evidence
        shell: pwsh
        run: ./scripts/test-standard-code-packaged-readiness.ps1

      - name: Build Desktop twice and compare bytes
        shell: pwsh
        run: ./scripts/build-desktop.ps1 -Version '${{ needs.dependency-boundaries.outputs.version }}' -VerifyReproducible

      - name: Validate Store and direct-EXE signing configuration
        if: ${{ github.event_name != 'pull_request' }}
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.dependency-boundaries.outputs.version }}
          IS_PRERELEASE: ${{ needs.dependency-boundaries.outputs.prerelease }}
          RELEASE_PHASE: ${{ needs.dependency-boundaries.outputs.phase }}
        run: |
          $storeValues = @(
            $env:STORE_PACKAGE_IDENTITY_NAME,
            $env:STORE_PACKAGE_PUBLISHER,
            $env:STORE_PUBLISHER_DISPLAY_NAME,
            $env:STORE_PACKAGE_VERSION
          )
          $configured = @($storeValues | Where-Object {
              -not [string]::IsNullOrWhiteSpace([string]$_)
            }).Count
          if ($configured -ne 0 -and $configured -ne $storeValues.Count) {
            throw "Store identity configuration is partial"
          }
          if ($env:IS_PRERELEASE -notin @("true", "false")) {
            throw "Resolved prerelease state is invalid"
          }
          $stable = $env:IS_PRERELEASE -ceq "false"
          $signerValues = @(
            $env:DIRECT_EXE_SIGNER_SUBJECT,
            $env:DIRECT_EXE_SIGNER_THUMBPRINT
          )
          $signerConfigured = @($signerValues | Where-Object {
              -not [string]::IsNullOrWhiteSpace([string]$_)
            }).Count
          if ($signerConfigured -ne 0 -and $signerConfigured -ne $signerValues.Count) {
            throw "Direct EXE signer identity configuration is partial"
          }
          if ($stable -and $signerConfigured -ne $signerValues.Count) {
            throw "A stable release requires the exact direct EXE signer Subject and thumbprint"
          }
          if ($stable -and $env:RELEASE_PHASE -ceq 'finalize' -and
              $configured -ne $storeValues.Count) {
            throw "A stable release requires the exact Partner Center identity and an explicit Store package version"
          }
          if ($configured -eq $storeValues.Count) {
            $parts = @($env:STORE_PACKAGE_VERSION.Split("."))
            if ($parts.Count -ne 4 -or $parts[0] -notmatch '^[1-9][0-9]*$' -or
                $parts[1] -notmatch '^[0-9]+$' -or $parts[2] -notmatch '^[0-9]+$' -or
                $parts[3] -cne "0") {
              throw "Store package version must be explicit, four-part, Major >= 1, and Revision = 0"
            }
            foreach ($part in $parts) {
              if ([uint64]$part -gt 65535) { throw "Store package version component is too large" }
            }
          }

      - name: Prepare protected direct-EXE signing request
        if: ${{ needs.dependency-boundaries.outputs.signing_prepare == 'true' }}
        shell: pwsh
        run: |
          ./scripts/stage-direct-exe.ps1 `
            -Channel stable `
            -PrepareSigningRequest `
            -ExpectedVersion '${{ needs.dependency-boundaries.outputs.version }}' `
            -ExpectedRevision '${{ needs.dependency-boundaries.outputs.revision }}' `
            -ExpectedSignerSubject $env:DIRECT_EXE_SIGNER_SUBJECT `
            -ExpectedSignerThumbprint $env:DIRECT_EXE_SIGNER_THUMBPRINT

      - name: Upload isolated direct-EXE signing request
        if: ${{ needs.dependency-boundaries.outputs.signing_prepare == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ needs.dependency-boundaries.outputs.artifact_name }}-direct-exe-signing-request
          if-no-files-found: error
          retention-days: 7
          path: |
            build/desktop/TraverseBoard.exe
            build/desktop/release-metadata.json
            build/desktop/direct-exe-signing-request.json

      - name: Package internal verification ZIP with evidence
        if: ${{ needs.dependency-boundaries.outputs.signing_prepare != 'true' }}
        shell: pwsh
        run: ./scripts/package-portable-zip.ps1 -Version '${{ needs.dependency-boundaries.outputs.version }}' -VerifyReproducible

      - name: Verify direct executable through the internal archive
        if: ${{ needs.dependency-boundaries.outputs.signing_prepare != 'true' }}
        shell: pwsh
        run: |
          ./scripts/verify-portable-zip.ps1 `
            -ExpectedVersion '${{ needs.dependency-boundaries.outputs.version }}' `
            -ExpectedRevision '${{ needs.dependency-boundaries.outputs.revision }}' `
            -SmokeTest

      - name: Validate Draft Release evidence intake
        if: ${{ github.event_name != 'pull_request' && needs.dependency-boundaries.outputs.signing_prepare != 'true' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.dependency-boundaries.outputs.version }}
        run: |
          $release = gh release view $env:RELEASE_VERSION `
            --repo $env:GITHUB_REPOSITORY `
            --json isDraft,tagName,assets | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or -not [bool]$release.isDraft -or
              [string]$release.tagName -cne $env:RELEASE_VERSION) {
            throw "A matching Draft Release is required for candidate-bound evidence intake"
          }
          $required = @(
            "standard-code-product-e2e.json",
            "standard-code-security-evidence.json"
          )
          $stable = '${{ needs.dependency-boundaries.outputs.prerelease }}' -ceq 'false'
          if ($stable) {
            $required += @(
              "direct-exe-signing-request.json",
              "TraverseBoard-signed.exe",
              "direct-exe-signing-handoff.json"
            )
          }
          $assets = @($release.assets)
          if ($assets.Count -ne $required.Count) {
            throw "The candidate evidence Draft Release differs from the exact channel-bound intake allowlist"
          }
          foreach ($name in $required) {
            $matches = @($assets | Where-Object { [string]$_.name -ceq $name })
            $maximumSize = switch ($name) {
              "TraverseBoard-signed.exe" { 536870912 }
              "direct-exe-signing-request.json" { 1048576 }
              "direct-exe-signing-handoff.json" { 1048576 }
              default { 4194304 }
            }
            if ($matches.Count -ne 1 -or [int64]$matches[0].size -le 0 -or
                [int64]$matches[0].size -gt $maximumSize) {
              throw "Draft Release evidence asset is missing, duplicated, empty, or oversized: $name"
            }
          }
          foreach ($name in @(
              "standard-code-product-e2e.json",
              "standard-code-security-evidence.json"
            )) {
            $target = Join-Path "build/desktop" $name
            if (Test-Path -LiteralPath $target) {
              throw "Evidence intake target already exists: $name"
            }
          }
          gh release download $env:RELEASE_VERSION `
            --repo $env:GITHUB_REPOSITORY `
            --pattern 'standard-code-product-e2e.json' `
            --pattern 'standard-code-security-evidence.json' `
            --dir build/desktop
          if ($LASTEXITCODE -ne 0) { throw "Draft Release evidence download failed" }
          foreach ($name in @(
              "standard-code-product-e2e.json",
              "standard-code-security-evidence.json"
            )) {
            $item = Get-Item -LiteralPath (Join-Path "build/desktop" $name) -Force
            if (-not $item.PSIsContainer -and
                -not ($item.Attributes -band [System.IO.FileAttributes]::ReparsePoint) -and
                $item.Length -gt 0 -and $item.Length -le 4194304) { continue }
            throw "Downloaded evidence asset is unsafe: $name"
          }
          if ($stable) {
            New-Item -ItemType Directory -Force -Path build/signing | Out-Null
            gh release download $env:RELEASE_VERSION `
              --repo $env:GITHUB_REPOSITORY `
              --pattern 'direct-exe-signing-request.json' `
              --pattern 'TraverseBoard-signed.exe' `
              --pattern 'direct-exe-signing-handoff.json' `
              --dir build/signing
            if ($LASTEXITCODE -ne 0) { throw "Stable signing handoff download failed" }
            $request = Get-Item -LiteralPath build/signing/direct-exe-signing-request.json -Force
            $signed = Get-Item -LiteralPath build/signing/TraverseBoard-signed.exe -Force
            $handoff = Get-Item -LiteralPath build/signing/direct-exe-signing-handoff.json -Force
            foreach ($item in @($request, $signed, $handoff)) {
              if ($item.PSIsContainer -or
                  ($item.Attributes -band [System.IO.FileAttributes]::ReparsePoint) -or
                  $item.Length -le 0) {
                throw "Downloaded signing handoff input is unsafe: $($item.Name)"
              }
            }
            if ($request.Length -gt 1048576 -or $signed.Length -gt 536870912 -or
                $handoff.Length -gt 1048576) {
              throw "Downloaded signing handoff input is oversized"
            }
          }

      - name: Exercise packaged Standard Code bootstrap
        if: ${{ github.event_name == 'pull_request' && needs.dependency-boundaries.outputs.signing_prepare != 'true' }}
        shell: pwsh
        run: |
          ./scripts/standard-code-packaged-e2e.ps1 `
            -ExpectedVersion '${{ needs.dependency-boundaries.outputs.version }}' `
            -ExpectedRevision '${{ needs.dependency-boundaries.outputs.revision }}'

      - name: Aggregate candidate-bound Standard Code release evidence
        if: ${{ github.event_name != 'pull_request' && needs.dependency-boundaries.outputs.signing_prepare != 'true' }}
        shell: pwsh
        run: |
          ./scripts/standard-code-packaged-e2e.ps1 `
            -ExpectedVersion '${{ needs.dependency-boundaries.outputs.version }}' `
            -ExpectedRevision '${{ needs.dependency-boundaries.outputs.revision }}' `
            -ProductReportPath 'build/desktop/standard-code-product-e2e.json' `
            -SecurityReportPath 'build/desktop/standard-code-security-evidence.json' `
            -AggregateOutputPath 'build/desktop/standard-code-release-gate.json' `
            -RequireReleaseGate

      - name: Stage prerelease direct executable
        if: ${{ needs.dependency-boundaries.outputs.signing_prepare != 'true' && needs.dependency-boundaries.outputs.prerelease == 'true' }}
        shell: pwsh
        run: |
          ./scripts/stage-direct-exe.ps1 `
            -Channel prerelease `
            -ExpectedVersion '${{ needs.dependency-boundaries.outputs.version }}' `
            -ExpectedRevision '${{ needs.dependency-boundaries.outputs.revision }}'

      - name: Stage trusted stable direct executable
        if: ${{ github.event_name != 'pull_request' && needs.dependency-boundaries.outputs.signing_prepare != 'true' && needs.dependency-boundaries.outputs.prerelease == 'false' }}
        shell: pwsh
        run: |
          ./scripts/stage-direct-exe.ps1 `
            -Channel stable `
            -SigningRequestPath build/signing/direct-exe-signing-request.json `
            -SignedArtifactPath build/signing/TraverseBoard-signed.exe `
            -SigningHandoffPath build/signing/direct-exe-signing-handoff.json `
            -ExpectedVersion '${{ needs.dependency-boundaries.outputs.version }}' `
            -ExpectedRevision '${{ needs.dependency-boundaries.outputs.revision }}' `
            -ExpectedSignerSubject $env:DIRECT_EXE_SIGNER_SUBJECT `
            -ExpectedSignerThumbprint $env:DIRECT_EXE_SIGNER_THUMBPRINT

      - name: Reverify staged direct executable
        if: ${{ needs.dependency-boundaries.outputs.signing_prepare != 'true' }}
        shell: pwsh
        env:
          IS_PRERELEASE: ${{ needs.dependency-boundaries.outputs.prerelease }}
        run: |
          $parameters = @{
            ExpectedVersion = '${{ needs.dependency-boundaries.outputs.version }}'
            ExpectedRevision = '${{ needs.dependency-boundaries.outputs.revision }}'
            VerifyOnly = $true
          }
          if ($env:IS_PRERELEASE -ceq 'false') {
            $parameters.ExpectedSignerSubject = $env:DIRECT_EXE_SIGNER_SUBJECT
            $parameters.ExpectedSignerThumbprint = $env:DIRECT_EXE_SIGNER_THUMBPRINT
          }
          ./scripts/stage-direct-exe.ps1 @parameters

      - name: Package unsigned development MSIX candidate
        if: ${{ needs.dependency-boundaries.outputs.signing_prepare != 'true' && (github.event_name == 'pull_request' || needs.dependency-boundaries.outputs.prerelease == 'true' || vars.STORE_PACKAGE_IDENTITY_NAME == '' || vars.STORE_PACKAGE_PUBLISHER == '' || vars.STORE_PUBLISHER_DISPLAY_NAME == '' || vars.STORE_PACKAGE_VERSION == '') }}
        shell: pwsh
        run: ./scripts/package-msix.ps1 -Version '${{ needs.dependency-boundaries.outputs.msix_version }}'

      - name: Inspect development MSIX candidate
        if: ${{ needs.dependency-boundaries.outputs.signing_prepare != 'true' && (github.event_name == 'pull_request' || needs.dependency-boundaries.outputs.prerelease == 'true' || vars.STORE_PACKAGE_IDENTITY_NAME == '' || vars.STORE_PACKAGE_PUBLISHER == '' || vars.STORE_PUBLISHER_DISPLAY_NAME == '' || vars.STORE_PACKAGE_VERSION == '') }}
        shell: pwsh
        run: ./scripts/verify-msix.ps1 -Action inspect

      - name: Exercise synthetic Partner Center contract on pull requests
        if: ${{ github.event_name == 'pull_request' && needs.dependency-boundaries.outputs.signing_prepare != 'true' }}
        shell: pwsh
        run: |
          ./scripts/package-msix.ps1 `
            -Distribution MicrosoftStore `
            -ContractTest `
            -Version 1.0.0.0 `
            -PackageIdentityName TraverseBoard.CI.Contract `
            -PackagePublisher 'CN=Traverse Board CI Contract' `
            -PublisherDisplayName 'Traverse Board CI Contract'
          ./scripts/verify-msix.ps1 -Action inspect

      - name: Restore development MSIX evidence after synthetic Store check
        if: ${{ github.event_name == 'pull_request' && needs.dependency-boundaries.outputs.signing_prepare != 'true' }}
        shell: pwsh
        run: |
          ./scripts/package-msix.ps1 -Version '${{ needs.dependency-boundaries.outputs.msix_version }}'
          ./scripts/verify-msix.ps1 -Action inspect

      - name: Package Partner Center-bound Store upload
        if: ${{ github.event_name != 'pull_request' && needs.dependency-boundaries.outputs.signing_prepare != 'true' && needs.dependency-boundaries.outputs.prerelease == 'false' && vars.STORE_PACKAGE_IDENTITY_NAME != '' && vars.STORE_PACKAGE_PUBLISHER != '' && vars.STORE_PUBLISHER_DISPLAY_NAME != '' && vars.STORE_PACKAGE_VERSION != '' }}
        shell: pwsh
        run: ./scripts/package-msix.ps1 -Distribution MicrosoftStore -Version $env:STORE_PACKAGE_VERSION -PackageIdentityName $env:STORE_PACKAGE_IDENTITY_NAME -PackagePublisher $env:STORE_PACKAGE_PUBLISHER -PublisherDisplayName $env:STORE_PUBLISHER_DISPLAY_NAME -ExpectedDirectSignerSubject $env:DIRECT_EXE_SIGNER_SUBJECT -ExpectedDirectSignerThumbprint $env:DIRECT_EXE_SIGNER_THUMBPRINT

      - name: Inspect Partner Center-bound Store upload
        if: ${{ github.event_name != 'pull_request' && needs.dependency-boundaries.outputs.signing_prepare != 'true' && needs.dependency-boundaries.outputs.prerelease == 'false' && vars.STORE_PACKAGE_IDENTITY_NAME != '' && vars.STORE_PACKAGE_PUBLISHER != '' && vars.STORE_PUBLISHER_DISPLAY_NAME != '' && vars.STORE_PACKAGE_VERSION != '' }}
        shell: pwsh
        run: ./scripts/verify-msix.ps1 -Action inspect -ExpectedDirectSignerSubject $env:DIRECT_EXE_SIGNER_SUBJECT -ExpectedDirectSignerThumbprint $env:DIRECT_EXE_SIGNER_THUMBPRINT

      - name: Upload exact Desktop verification and direct-EXE candidate
        if: ${{ needs.dependency-boundaries.outputs.signing_prepare != 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ needs.dependency-boundaries.outputs.artifact_name }}
          if-no-files-found: error
          retention-days: 14
          path: |
            build/desktop/TraverseBoard.exe
            build/desktop/TraverseBoard.direct.exe
            build/desktop/direct-exe-signing.json
            build/desktop/direct-exe-signing-request.json
            build/desktop/direct-exe-signing-handoff.json
            build/desktop/Prayu-portable-*.zip
            build/desktop/SHA256SUMS
            build/desktop/verification-SHA256SUMS
            build/desktop/portable-zip-manifest.json
            build/desktop/release-metadata.json
            build/desktop/windows-compatibility.json
            build/desktop/standard-code-packaged-e2e.json
            build/desktop/standard-code-product-e2e.json
            build/desktop/standard-code-security-evidence.json
            build/desktop/standard-code-release-gate.json
            build/desktop/sbom.json
            build/desktop/NOTICE

      - name: Preserve failed packaged validation diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-packaged-validation-${{ github.run_id }}
          path: build/desktop/standard-code-packaged-e2e.json
          if-no-files-found: warn
          retention-days: 5

      - name: Upload isolated development MSIX validation artifact
        if: ${{ needs.dependency-boundaries.outputs.signing_prepare != 'true' && (github.event_name == 'pull_request' || needs.dependency-boundaries.outputs.prerelease == 'true' || vars.STORE_PACKAGE_IDENTITY_NAME == '' || vars.STORE_PACKAGE_PUBLISHER == '' || vars.STORE_PUBLISHER_DISPLAY_NAME == '' || vars.STORE_PACKAGE_VERSION == '') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ needs.dependency-boundaries.outputs.artifact_name }}-development-msix
          if-no-files-found: error
          retention-days: 7
          path: |
            build/desktop/TraverseBoard.exe
            build/desktop/TraverseBoard.direct.exe
            build/desktop/direct-exe-signing.json
            build/desktop/PrayuDesktop.msix
            build/desktop/msix-manifest.json
            build/desktop/release-metadata.json

      - name: Upload isolated Partner Center submission artifact
        if: ${{ github.event_name != 'pull_request' && needs.dependency-boundaries.outputs.signing_prepare != 'true' && needs.dependency-boundaries.outputs.prerelease == 'false' && vars.STORE_PACKAGE_IDENTITY_NAME != '' && vars.STORE_PACKAGE_PUBLISHER != '' && vars.STORE_PUBLISHER_DISPLAY_NAME != '' && vars.STORE_PACKAGE_VERSION != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ needs.dependency-boundaries.outputs.artifact_name }}-partner-center
          if-no-files-found: error
          retention-days: 14
          path: |
            build/desktop/TraverseBoard.exe
            build/desktop/TraverseBoard.direct.exe
            build/desktop/direct-exe-signing.json
            build/desktop/direct-exe-signing-request.json
            build/desktop/direct-exe-signing-handoff.json
            build/desktop/TraverseBoard_${{ env.STORE_PACKAGE_VERSION }}_x64.msix
            build/desktop/TraverseBoard_${{ env.STORE_PACKAGE_VERSION }}_x64.msixupload
            build/desktop/msix-manifest.json
            build/desktop/release-metadata.json
            build/desktop/Prayu-portable-*.zip
            build/desktop/portable-zip-manifest.json
            build/desktop/standard-code-packaged-e2e.json
            build/desktop/standard-code-product-e2e.json
            build/desktop/standard-code-security-evidence.json
            build/desktop/standard-code-release-gate.json
            build/desktop/sbom.json
            build/desktop/NOTICE
            build/desktop/windows-compatibility.json
            build/desktop/SHA256SUMS
            build/desktop/verification-SHA256SUMS

  attest-windows-artifacts:
    name: Attest Windows release artifacts
    if: ${{ github.event_name != 'pull_request' && needs.portable-zip.outputs.phase != 'prepare' && needs.portable-zip.outputs.signing_prepare != 'true' }}
    needs: portable-zip
    runs-on: windows-latest
    permissions:
      actions: read
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      DIRECT_EXE_SIGNER_SUBJECT: ${{ vars.DIRECT_EXE_SIGNER_SUBJECT }}
      DIRECT_EXE_SIGNER_THUMBPRINT: ${{ vars.DIRECT_EXE_SIGNER_THUMBPRINT }}
    steps:
      - name: Checkout attested source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Download exact Windows candidate
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build/desktop | Out-Null
          gh run download $env:GITHUB_RUN_ID `
            --repo $env:GITHUB_REPOSITORY `
            --name '${{ needs.portable-zip.outputs.artifact_name }}' `
            --dir build/desktop
          if ($LASTEXITCODE -ne 0) { throw "Exact Windows candidate download failed" }

      - name: Set up repository-pinned Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Reverify downloaded Windows candidate
        shell: pwsh
        env:
          IS_PRERELEASE: ${{ needs.portable-zip.outputs.prerelease }}
        run: |
          $portableParameters = @{
            ExpectedVersion = '${{ needs.portable-zip.outputs.version }}'
            ExpectedRevision = '${{ needs.portable-zip.outputs.revision }}'
          }
          if ($env:IS_PRERELEASE -ceq 'false') {
            $portableParameters.ExpectedDirectSignerSubject = $env:DIRECT_EXE_SIGNER_SUBJECT
            $portableParameters.ExpectedDirectSignerThumbprint = $env:DIRECT_EXE_SIGNER_THUMBPRINT
          }
          ./scripts/verify-portable-zip.ps1 @portableParameters
          $directParameters = @{
            ExpectedVersion = '${{ needs.portable-zip.outputs.version }}'
            ExpectedRevision = '${{ needs.portable-zip.outputs.revision }}'
            VerifyOnly = $true
          }
          if ($env:IS_PRERELEASE -ceq 'false') {
            $directParameters.ExpectedSignerSubject = $env:DIRECT_EXE_SIGNER_SUBJECT
            $directParameters.ExpectedSignerThumbprint = $env:DIRECT_EXE_SIGNER_THUMBPRINT
          }
          ./scripts/stage-direct-exe.ps1 @directParameters
          $manifest = Get-Content -LiteralPath build/desktop/portable-zip-manifest.json `
            -Raw | ConvertFrom-Json
          $archive = Join-Path build/desktop ([string]$manifest.zip_name)
          go run ./cmd/releasegate `
            --binary build/desktop/TraverseBoard.exe `
            --archive $archive `
            --portable-manifest build/desktop/portable-zip-manifest.json `
            --release-metadata build/desktop/release-metadata.json `
            --bootstrap build/desktop/standard-code-packaged-e2e.json `
            --product build/desktop/standard-code-product-e2e.json `
            --security build/desktop/standard-code-security-evidence.json `
            --expected-revision '${{ needs.portable-zip.outputs.revision }}' `
            --verify-report build/desktop/standard-code-release-gate.json
          if ($LASTEXITCODE -ne 0) { throw "Attestation candidate release-gate revalidation failed" }

      - name: Download and reverify stable Store submission
        if: ${{ needs.portable-zip.outputs.prerelease == 'false' }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build/store | Out-Null
          gh run download $env:GITHUB_RUN_ID `
            --repo $env:GITHUB_REPOSITORY `
            --name '${{ needs.portable-zip.outputs.artifact_name }}-partner-center' `
            --dir build/store
          if ($LASTEXITCODE -ne 0) { throw "Partner Center submission artifact download failed" }
          ./scripts/verify-msix.ps1 `
            -ManifestPath build/store/msix-manifest.json `
            -Action inspect `
            -ExpectedDirectSignerSubject $env:DIRECT_EXE_SIGNER_SUBJECT `
            -ExpectedDirectSignerThumbprint $env:DIRECT_EXE_SIGNER_THUMBPRINT

      - name: Prepare exact attestation subjects
        id: subjects
        shell: pwsh
        env:
          IS_PRERELEASE: ${{ needs.portable-zip.outputs.prerelease }}
        run: |
          New-Item -ItemType Directory -Force -Path build/attestation-subjects | Out-Null
          Copy-Item -LiteralPath build/desktop/TraverseBoard.direct.exe `
            -Destination build/attestation-subjects/TraverseBoard.exe
          $directHash = (Get-FileHash -Algorithm SHA256 `
            -LiteralPath build/attestation-subjects/TraverseBoard.exe).Hash.ToLowerInvariant()
          "direct_sha256=$directHash" >> $env:GITHUB_OUTPUT
          if ($env:IS_PRERELEASE -ceq 'false') {
            $storeEvidence = Get-Content -LiteralPath build/store/msix-manifest.json `
              -Raw | ConvertFrom-Json
            $uploadName = [string]$storeEvidence.msixupload_name
            if ([string]::IsNullOrWhiteSpace($uploadName) -or
                [System.IO.Path]::GetFileName($uploadName) -cne $uploadName) {
              throw "Store attestation subject filename is unsafe"
            }
            $storePath = Join-Path build/store $uploadName
            if (-not (Test-Path -LiteralPath $storePath -PathType Leaf)) {
              throw "Store attestation subject is missing"
            }
            $storeHash = (Get-FileHash -Algorithm SHA256 `
              -LiteralPath $storePath).Hash.ToLowerInvariant()
            "store_present=true" >> $env:GITHUB_OUTPUT
            "store_subject=build/store/$uploadName" >> $env:GITHUB_OUTPUT
            "store_name=$uploadName" >> $env:GITHUB_OUTPUT
            "store_sha256=$storeHash" >> $env:GITHUB_OUTPUT
          } else {
            "store_present=false" >> $env:GITHUB_OUTPUT
            "store_subject=" >> $env:GITHUB_OUTPUT
            "store_name=" >> $env:GITHUB_OUTPUT
            "store_sha256=" >> $env:GITHUB_OUTPUT
          }

      - name: Attest direct EXE provenance
        id: direct_provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: build/attestation-subjects/TraverseBoard.exe

      - name: Attest direct EXE SBOM
        id: direct_sbom
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: build/attestation-subjects/TraverseBoard.exe
          sbom-path: build/desktop/sbom.json

      - name: Attest Store upload provenance
        id: store_provenance
        if: ${{ steps.subjects.outputs.store_present == 'true' }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ steps.subjects.outputs.store_subject }}

      - name: Verify bundles and write hash-bound attestation index
        shell: pwsh
        env:
          DIRECT_SHA256: ${{ steps.subjects.outputs.direct_sha256 }}
          STORE_PRESENT: ${{ steps.subjects.outputs.store_present }}
          STORE_SUBJECT: ${{ steps.subjects.outputs.store_subject }}
          STORE_NAME: ${{ steps.subjects.outputs.store_name }}
          STORE_SHA256: ${{ steps.subjects.outputs.store_sha256 }}
          DIRECT_PROVENANCE_BUNDLE: ${{ steps.direct_provenance.outputs.bundle-path }}
          DIRECT_PROVENANCE_ID: ${{ steps.direct_provenance.outputs.attestation-id }}
          DIRECT_PROVENANCE_URL: ${{ steps.direct_provenance.outputs.attestation-url }}
          DIRECT_SBOM_BUNDLE: ${{ steps.direct_sbom.outputs.bundle-path }}
          DIRECT_SBOM_ID: ${{ steps.direct_sbom.outputs.attestation-id }}
          DIRECT_SBOM_URL: ${{ steps.direct_sbom.outputs.attestation-url }}
          STORE_PROVENANCE_BUNDLE: ${{ steps.store_provenance.outputs.bundle-path }}
          STORE_PROVENANCE_ID: ${{ steps.store_provenance.outputs.attestation-id }}
          STORE_PROVENANCE_URL: ${{ steps.store_provenance.outputs.attestation-url }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path build/attestations | Out-Null
          function Get-SHA256([string]$Path) {
            return (Get-FileHash -Algorithm SHA256 -LiteralPath $Path).Hash.ToLowerInvariant()
          }
          function Get-Statement([string]$BundlePath) {
            $bundle = Get-Content -LiteralPath $BundlePath -Raw | ConvertFrom-Json
            $payload = [string]$bundle.dsseEnvelope.payload
            if ([string]::IsNullOrWhiteSpace($payload)) {
              throw "Attestation bundle has no DSSE payload"
            }
            $json = [System.Text.Encoding]::UTF8.GetString(
              [System.Convert]::FromBase64String($payload))
            return ($json | ConvertFrom-Json)
          }
          function New-AttestationEntry(
              [string]$Kind,
              [string]$SubjectPath,
              [string]$SubjectName,
              [string]$SubjectHash,
              [string]$SourceBundle,
              [string]$BundleName,
              [string]$AttestationID,
              [string]$AttestationURL) {
            if ([string]::IsNullOrWhiteSpace($SourceBundle) -or
                -not (Test-Path -LiteralPath $SourceBundle -PathType Leaf) -or
                [string]::IsNullOrWhiteSpace($AttestationID) -or
                $AttestationURL -notmatch '^https://github\.com/') {
              throw "Attestation action outputs are incomplete for $Kind"
            }
            $bundlePath = Join-Path build/attestations $BundleName
            Copy-Item -LiteralPath $SourceBundle -Destination $bundlePath
            $statement = Get-Statement $bundlePath
            $predicateType = [string]$statement.predicateType
            $subjects = @($statement.subject)
            if ([string]::IsNullOrWhiteSpace($predicateType) -or
                $subjects.Count -ne 1 -or
                [string]$subjects[0].name -cne $SubjectName -or
                [string]$subjects[0].digest.sha256 -cne $SubjectHash) {
              throw "Attestation bundle subject differs for $Kind"
            }
            if ($Kind -like '*_provenance' -and
                $predicateType -cne 'https://slsa.dev/provenance/v1') {
              throw "Provenance attestation predicate differs for $Kind"
            }
            if ($Kind -ceq 'direct_exe_sbom' -and
                $predicateType -cne 'https://cyclonedx.org/bom') {
              throw "Direct EXE SBOM attestation predicate differs"
            }
            gh attestation verify $SubjectPath `
              --bundle $bundlePath `
              --repo $env:GITHUB_REPOSITORY `
              --signer-workflow "$env:GITHUB_REPOSITORY/.github/workflows/release-desktop.yml" `
              --source-digest '${{ needs.portable-zip.outputs.revision }}' `
              --predicate-type $predicateType | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "Attestation verification failed for $Kind" }
            return [ordered]@{
              kind = $Kind
              predicate_type = $predicateType
              subject_name = $SubjectName
              subject_sha256 = $SubjectHash
              attestation_id = $AttestationID
              attestation_url = $AttestationURL
              bundle_name = $BundleName
              bundle_sha256 = (Get-SHA256 $bundlePath)
            }
          }
          $entries = [System.Collections.Generic.List[object]]::new()
          $entries.Add((New-AttestationEntry `
            -Kind direct_exe_provenance `
            -SubjectPath build/attestation-subjects/TraverseBoard.exe `
            -SubjectName TraverseBoard.exe `
            -SubjectHash $env:DIRECT_SHA256 `
            -SourceBundle $env:DIRECT_PROVENANCE_BUNDLE `
            -BundleName direct-exe-provenance.bundle.json `
            -AttestationID $env:DIRECT_PROVENANCE_ID `
            -AttestationURL $env:DIRECT_PROVENANCE_URL))
          $entries.Add((New-AttestationEntry `
            -Kind direct_exe_sbom `
            -SubjectPath build/attestation-subjects/TraverseBoard.exe `
            -SubjectName TraverseBoard.exe `
            -SubjectHash $env:DIRECT_SHA256 `
            -SourceBundle $env:DIRECT_SBOM_BUNDLE `
            -BundleName direct-exe-sbom.bundle.json `
            -AttestationID $env:DIRECT_SBOM_ID `
            -AttestationURL $env:DIRECT_SBOM_URL))
          if ($env:STORE_PRESENT -ceq 'true') {
            $entries.Add((New-AttestationEntry `
              -Kind store_msixupload_provenance `
              -SubjectPath $env:STORE_SUBJECT `
              -SubjectName $env:STORE_NAME `
              -SubjectHash $env:STORE_SHA256 `
              -SourceBundle $env:STORE_PROVENANCE_BUNDLE `
              -BundleName store-msixupload-provenance.bundle.json `
              -AttestationID $env:STORE_PROVENANCE_ID `
              -AttestationURL $env:STORE_PROVENANCE_URL))
          }
          $storeIndexHash = ''
          if ($env:STORE_PRESENT -ceq 'true') {
            $storeIndexHash = $env:STORE_SHA256
          }
          $index = [ordered]@{
            protocol_version = 'windows_artifact_attestations.v1'
            release_version = '${{ needs.portable-zip.outputs.version }}'
            release_revision = '${{ needs.portable-zip.outputs.revision }}'
            direct_exe_sha256 = $env:DIRECT_SHA256
            store_msixupload_sha256 = $storeIndexHash
            attestations = @($entries)
          }
          [System.IO.File]::WriteAllText(
            (Join-Path build/attestations artifact-attestations.json),
            (($index | ConvertTo-Json -Depth 6) + [System.Environment]::NewLine),
            [System.Text.UTF8Encoding]::new($false))

      - name: Upload exact attestation bundles and index
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ needs.portable-zip.outputs.artifact_name }}-attestations
          if-no-files-found: error
          retention-days: 14
          path: |
            build/attestations/artifact-attestations.json
            build/attestations/*.bundle.json

  publish:
    name: Publish verified GitHub Release
    if: ${{ github.event_name == 'push' && github.ref_type == 'tag' && needs.portable-zip.outputs.phase == 'finalize' && needs.portable-zip.outputs.signing_prepare != 'true' }}
    needs:
      - portable-zip
      - attest-windows-artifacts
      - macos-archive
    runs-on: windows-latest
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      DIRECT_EXE_SIGNER_SUBJECT: ${{ vars.DIRECT_EXE_SIGNER_SUBJECT }}
      DIRECT_EXE_SIGNER_THUMBPRINT: ${{ vars.DIRECT_EXE_SIGNER_THUMBPRINT }}
    steps:
      - name: Checkout released source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Download the exact candidate from this run
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build/desktop | Out-Null
          gh run download $env:GITHUB_RUN_ID `
            --repo $env:GITHUB_REPOSITORY `
            --name '${{ needs.portable-zip.outputs.artifact_name }}' `
            --dir build/desktop
          if ($LASTEXITCODE -ne 0) { throw "Exact Windows candidate download failed" }
          New-Item -ItemType Directory -Force -Path build/attestations | Out-Null
          gh run download $env:GITHUB_RUN_ID `
            --repo $env:GITHUB_REPOSITORY `
            --name '${{ needs.portable-zip.outputs.artifact_name }}-attestations' `
            --dir build/attestations
          if ($LASTEXITCODE -ne 0) { throw "Exact attestation artifact download failed" }

      - name: Download and reverify both exact Mac archives from this run
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.portable-zip.outputs.version }}
          RELEASE_REVISION: ${{ needs.portable-zip.outputs.revision }}
          IS_PRERELEASE: ${{ needs.portable-zip.outputs.prerelease }}
        run: |
          foreach ($arch in @('arm64', 'amd64')) {
            $directory = "build/macos/$arch"
            gh run download $env:GITHUB_RUN_ID --repo $env:GITHUB_REPOSITORY `
              --name "TraverseBoard-macos-$arch-$env:RELEASE_REVISION" --dir $directory
            if ($LASTEXITCODE -ne 0) { throw "Exact Mac candidate download failed: $arch" }
            $verify = @('scripts/macos-release.py', 'verify', '--directory', $directory,
              '--version', $env:RELEASE_VERSION, '--revision', $env:RELEASE_REVISION, '--arch', $arch)
            if ($env:IS_PRERELEASE -ceq 'false') { $verify += '--require-release-ready' }
            python @verify
            if ($LASTEXITCODE -ne 0) { throw "Mac archive verification failed: $arch" }
            $dmgDirectory = "build/macos-dmg/$arch"
            gh run download $env:GITHUB_RUN_ID --repo $env:GITHUB_REPOSITORY `
              --name "TraverseBoard-macos-dmg-$arch-$env:RELEASE_REVISION" --dir $dmgDirectory
            if ($LASTEXITCODE -ne 0) { throw "Exact Mac DMG download failed: $arch" }
            $dmgName = "TraverseBoard-$env:RELEASE_VERSION-macos-$arch-$($env:RELEASE_REVISION.Substring(0,12))-preview.dmg"
            $dmgPath = Join-Path $dmgDirectory $dmgName
            $expectedChecksum = (Get-FileHash -Algorithm SHA256 -LiteralPath $dmgPath).Hash.ToLowerInvariant() + "  " + $dmgName
            $checksum = [System.IO.File]::ReadAllText("$dmgPath.sha256").TrimEnd([char[]]"`r`n")
            if ($checksum -cne $expectedChecksum) { throw "Mac DMG checksum differs: $arch" }
          }

      - name: Download stable Store submission from this run
        if: ${{ needs.portable-zip.outputs.prerelease == 'false' }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build/store | Out-Null
          gh run download $env:GITHUB_RUN_ID `
            --repo $env:GITHUB_REPOSITORY `
            --name '${{ needs.portable-zip.outputs.artifact_name }}-partner-center' `
            --dir build/store
          if ($LASTEXITCODE -ne 0) { throw "Exact Partner Center artifact download failed" }

      - name: Set up repository-pinned Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Reverify downloaded candidate
        shell: pwsh
        env:
          IS_PRERELEASE: ${{ needs.portable-zip.outputs.prerelease }}
        run: |
          $portableParameters = @{
            ExpectedVersion = '${{ needs.portable-zip.outputs.version }}'
            ExpectedRevision = '${{ needs.portable-zip.outputs.revision }}'
          }
          if ($env:IS_PRERELEASE -ceq 'false') {
            $portableParameters.ExpectedDirectSignerSubject = $env:DIRECT_EXE_SIGNER_SUBJECT
            $portableParameters.ExpectedDirectSignerThumbprint = $env:DIRECT_EXE_SIGNER_THUMBPRINT
          }
          ./scripts/verify-portable-zip.ps1 @portableParameters
          $directParameters = @{
            ExpectedVersion = '${{ needs.portable-zip.outputs.version }}'
            ExpectedRevision = '${{ needs.portable-zip.outputs.revision }}'
            VerifyOnly = $true
          }
          if ($env:IS_PRERELEASE -ceq 'false') {
            $directParameters.ExpectedSignerSubject = $env:DIRECT_EXE_SIGNER_SUBJECT
            $directParameters.ExpectedSignerThumbprint = $env:DIRECT_EXE_SIGNER_THUMBPRINT
          }
          ./scripts/stage-direct-exe.ps1 @directParameters
          if ($env:IS_PRERELEASE -ceq 'false') {
            ./scripts/verify-msix.ps1 `
              -ManifestPath build/store/msix-manifest.json `
              -Action inspect `
              -ExpectedDirectSignerSubject $env:DIRECT_EXE_SIGNER_SUBJECT `
              -ExpectedDirectSignerThumbprint $env:DIRECT_EXE_SIGNER_THUMBPRINT
          }

      - name: Reverify aggregate Standard Code release gate
        shell: pwsh
        run: |
          $manifest = Get-Content -LiteralPath build/desktop/portable-zip-manifest.json `
            -Raw | ConvertFrom-Json
          $archive = Join-Path build/desktop ([string]$manifest.zip_name)
          go run ./cmd/releasegate `
            --binary build/desktop/TraverseBoard.exe `
            --archive $archive `
            --portable-manifest build/desktop/portable-zip-manifest.json `
            --release-metadata build/desktop/release-metadata.json `
            --bootstrap build/desktop/standard-code-packaged-e2e.json `
            --product build/desktop/standard-code-product-e2e.json `
            --security build/desktop/standard-code-security-evidence.json `
            --expected-revision '${{ needs.portable-zip.outputs.revision }}' `
            --verify-report build/desktop/standard-code-release-gate.json
          if ($LASTEXITCODE -ne 0) { throw "Aggregate Standard Code release gate revalidation failed" }

      - name: Reverify artifact attestation index and bundles
        shell: pwsh
        env:
          IS_PRERELEASE: ${{ needs.portable-zip.outputs.prerelease }}
        run: |
          $ErrorActionPreference = 'Stop'
          function Get-SHA256([string]$Path) {
            return (Get-FileHash -Algorithm SHA256 -LiteralPath $Path).Hash.ToLowerInvariant()
          }
          function Get-Statement([string]$BundlePath) {
            $bundle = Get-Content -LiteralPath $BundlePath -Raw | ConvertFrom-Json
            $payload = [string]$bundle.dsseEnvelope.payload
            if ([string]::IsNullOrWhiteSpace($payload)) {
              throw "Attestation bundle has no DSSE payload"
            }
            $json = [System.Text.Encoding]::UTF8.GetString(
              [System.Convert]::FromBase64String($payload))
            return ($json | ConvertFrom-Json)
          }
          $indexPath = 'build/attestations/artifact-attestations.json'
          if (-not (Test-Path -LiteralPath $indexPath -PathType Leaf)) {
            throw "Artifact attestation index is missing"
          }
          $index = Get-Content -LiteralPath $indexPath -Raw | ConvertFrom-Json
          $stable = $env:IS_PRERELEASE -ceq 'false'
          if ($env:IS_PRERELEASE -notin @('true', 'false') -or
              [string]$index.protocol_version -cne 'windows_artifact_attestations.v1' -or
              [string]$index.release_version -cne '${{ needs.portable-zip.outputs.version }}' -or
              [string]$index.release_revision -cne '${{ needs.portable-zip.outputs.revision }}') {
            throw "Artifact attestation index release identity is invalid"
          }
          New-Item -ItemType Directory -Force -Path build/public | Out-Null
          Copy-Item -LiteralPath build/desktop/TraverseBoard.direct.exe `
            -Destination build/public/TraverseBoard.exe
          $directHash = Get-SHA256 build/public/TraverseBoard.exe
          if ([string]$index.direct_exe_sha256 -cne $directHash) {
            throw "Attestation index differs from the staged direct EXE"
          }
          $storePath = ''
          $storeName = ''
          $storeHash = ''
          if ($stable) {
            $storeEvidence = Get-Content -LiteralPath build/store/msix-manifest.json `
              -Raw | ConvertFrom-Json
            $storeName = [string]$storeEvidence.msixupload_name
            if ([System.IO.Path]::GetFileName($storeName) -cne $storeName) {
              throw "Attested Store upload filename is unsafe"
            }
            $storePath = Join-Path build/store $storeName
            $storeHash = Get-SHA256 $storePath
            if ([string]$index.store_msixupload_sha256 -cne $storeHash) {
              throw "Attestation index differs from the Store upload"
            }
          } elseif (-not [string]::IsNullOrEmpty(
              [string]$index.store_msixupload_sha256)) {
            throw "Prerelease attestation index unexpectedly binds a Store upload"
          }
          $expectedKinds = @('direct_exe_provenance', 'direct_exe_sbom')
          if ($stable) { $expectedKinds += 'store_msixupload_provenance' }
          $expectedBundles = @{
            direct_exe_provenance = 'direct-exe-provenance.bundle.json'
            direct_exe_sbom = 'direct-exe-sbom.bundle.json'
            store_msixupload_provenance = 'store-msixupload-provenance.bundle.json'
          }
          $expectedPredicates = @{
            direct_exe_provenance = 'https://slsa.dev/provenance/v1'
            direct_exe_sbom = 'https://cyclonedx.org/bom'
            store_msixupload_provenance = 'https://slsa.dev/provenance/v1'
          }
          $entries = @($index.attestations)
          if ($entries.Count -ne $expectedKinds.Count) {
            throw "Artifact attestation entry count differs from the channel contract"
          }
          $seenKinds = [System.Collections.Generic.HashSet[string]]::new(
            [System.StringComparer]::Ordinal)
          $seenBundles = [System.Collections.Generic.HashSet[string]]::new(
            [System.StringComparer]::Ordinal)
          foreach ($entry in $entries) {
            $kind = [string]$entry.kind
            $predicateType = [string]$entry.predicate_type
            $bundleName = [string]$entry.bundle_name
            if ($kind -cnotin $expectedKinds -or -not $seenKinds.Add($kind) -or
                $predicateType -cne [string]$expectedPredicates[$kind] -or
                $bundleName -cne [string]$expectedBundles[$kind] -or
                [System.IO.Path]::GetFileName($bundleName) -cne $bundleName -or
                -not $seenBundles.Add($bundleName) -or
                [string]::IsNullOrWhiteSpace([string]$entry.attestation_id) -or
                [string]$entry.attestation_url -notmatch '^https://github\.com/') {
              throw "Artifact attestation entry metadata is invalid"
            }
            $subjectPath = 'build/public/TraverseBoard.exe'
            $subjectName = 'TraverseBoard.exe'
            $subjectHash = $directHash
            if ($kind -ceq 'store_msixupload_provenance') {
              $subjectPath = $storePath
              $subjectName = $storeName
              $subjectHash = $storeHash
            }
            if ([string]$entry.subject_name -cne $subjectName -or
                [string]$entry.subject_sha256 -cne $subjectHash) {
              throw "Artifact attestation entry subject differs from its exact file"
            }
            $bundlePath = Join-Path build/attestations $bundleName
            if (-not (Test-Path -LiteralPath $bundlePath -PathType Leaf) -or
                (Get-SHA256 $bundlePath) -cne [string]$entry.bundle_sha256) {
              throw "Artifact attestation bundle differs from its index"
            }
            $statement = Get-Statement $bundlePath
            $subjects = @($statement.subject)
            if ([string]$statement.predicateType -cne $predicateType -or
                $subjects.Count -ne 1 -or
                [string]$subjects[0].name -cne $subjectName -or
                [string]$subjects[0].digest.sha256 -cne $subjectHash -or
                ($kind -like '*_provenance' -and
                  $predicateType -cne 'https://slsa.dev/provenance/v1')) {
              throw "Artifact attestation bundle statement differs from its index"
            }
            gh attestation verify $subjectPath `
              --bundle $bundlePath `
              --repo $env:GITHUB_REPOSITORY `
              --signer-workflow "$env:GITHUB_REPOSITORY/.github/workflows/release-desktop.yml" `
              --source-digest '${{ needs.portable-zip.outputs.revision }}' `
              --predicate-type $predicateType
            if ($LASTEXITCODE -ne 0) { throw "Published attestation verification failed for $kind" }
          }
          foreach ($kind in $expectedKinds) {
            if (-not $seenKinds.Contains($kind)) {
              throw "Required artifact attestation is missing: $kind"
            }
          }

      - name: Create verified release asset set
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.portable-zip.outputs.version }}
          IS_PRERELEASE: ${{ needs.portable-zip.outputs.prerelease }}
        run: |
          $assets = @(
            "build/public/TraverseBoard.exe",
            "build/desktop/direct-exe-signing.json",
            "build/public/SHA256SUMS",
            "build/desktop/release-metadata.json",
            "build/desktop/windows-compatibility.json",
            "build/desktop/standard-code-packaged-e2e.json",
            "build/desktop/standard-code-product-e2e.json",
            "build/desktop/standard-code-security-evidence.json",
            "build/desktop/standard-code-release-gate.json",
            "build/desktop/sbom.json",
            "build/desktop/NOTICE",
            "build/attestations/artifact-attestations.json"
          )
          if ($env:IS_PRERELEASE -notin @('true', 'false')) {
            throw "Release notes channel state is invalid"
          }
          $stable = $env:IS_PRERELEASE -ceq 'false'
          if ($stable) {
            $assets += @(
              "build/desktop/direct-exe-signing-request.json",
              "build/desktop/direct-exe-signing-handoff.json"
            )
          }
          $attestationIndex = Get-Content `
            -LiteralPath build/attestations/artifact-attestations.json `
            -Raw | ConvertFrom-Json
          foreach ($entry in @($attestationIndex.attestations)) {
            $bundleName = [string]$entry.bundle_name
            if ([System.IO.Path]::GetFileName($bundleName) -cne $bundleName) {
              throw "Release attestation bundle filename is unsafe"
            }
            $assets += Join-Path build/attestations $bundleName
          }
          $macRevision = '${{ needs.portable-zip.outputs.revision }}'
          $publicChecksums = [System.IO.File]::ReadAllText('build/desktop/SHA256SUMS').TrimEnd([char[]]"`r`n")
          foreach ($arch in @('arm64', 'amd64')) {
            $stem = "TraverseBoard-$env:RELEASE_VERSION-macos-$arch-$($macRevision.Substring(0,12))-preview"
            foreach ($extension in @('.zip', '.manifest.json', '.sha256')) {
              $assets += "build/macos/$arch/$stem$extension"
            }
            $assets += "build/macos-dmg/$arch/$stem.dmg", "build/macos-dmg/$arch/$stem.dmg.sha256"
            $publicChecksums += "`n" + [System.IO.File]::ReadAllText("build/macos-dmg/$arch/$stem.dmg.sha256").TrimEnd([char[]]"`r`n")
          }
          [System.IO.File]::WriteAllText('build/public/SHA256SUMS', $publicChecksums + "`n", [System.Text.UTF8Encoding]::new($false))
          foreach ($asset in $assets) {
            if (-not (Test-Path -LiteralPath $asset -PathType Leaf)) {
              throw "Release asset is missing: $asset"
            }
          }
          $templatePath = 'packaging/windows/RELEASE-NOTES.md'
          if (-not (Test-Path -LiteralPath $templatePath -PathType Leaf)) {
            throw "Canonical Windows release-notes template is missing"
          }
          $template = [System.IO.File]::ReadAllText($templatePath)
          $template = $template.Replace("`r`n", "`n").Replace("`r", "`n")
          foreach ($marker in @(
              '<!-- windows-two-deliverable-contract.v1 -->',
              'Windows 下载 / Windows downloads',
              '本版本面向 Windows 用户只定义两个成品：',
              'This version defines exactly two Windows user products:',
              '直接 EXE 信任状态 / Direct-EXE trust state:',
              'Development MSIX、内部 portable ZIP',
              'development MSIX, internal portable ZIP'
            )) {
            if (-not $template.Contains($marker)) {
              throw "Windows release-notes template is missing a bilingual product-contract marker"
            }
          }
          foreach ($placeholder in @('{{VERSION}}', '{{TRUST_STATE}}')) {
            if ([regex]::Matches($template, [regex]::Escape($placeholder)).Count -ne 1) {
              throw "Windows release-notes template placeholder is missing or duplicated: $placeholder"
            }
          }
          $signingEvidence = Get-Content `
            -LiteralPath build/desktop/direct-exe-signing.json `
            -Raw | ConvertFrom-Json
          $trustedProperty = $signingEvidence.PSObject.Properties['trusted_release']
          if ($null -eq $trustedProperty -or $trustedProperty.Value -isnot [bool] -or
              [bool]$trustedProperty.Value -ne $stable) {
            throw "Windows release-notes trust state differs from direct-EXE evidence"
          }
          $trustState = if ($stable) {
            '已由受保护发布签名者签署，并通过 Authenticode、SHA-256 与 GitHub attestation 复验 / signed by the protected release signer and reverified with Authenticode, SHA-256, and GitHub attestations'
          } else {
            '未签名预发布候选；通过 SHA-256 与 GitHub attestation 绑定 / unsigned prerelease candidate; bound by SHA-256 and GitHub attestations'
          }
          $renderedNotes = $template.Replace('{{VERSION}}', $env:RELEASE_VERSION)
          $renderedNotes = $renderedNotes.Replace('{{TRUST_STATE}}', $trustState)
          if ([regex]::IsMatch($renderedNotes, '\{\{[^{}\r\n]+\}\}')) {
            throw "Windows release notes contain an unexpanded placeholder"
          }
          $renderedNotes = $renderedNotes.TrimEnd([char[]]"`r`n")
          $macTemplate = [System.IO.File]::ReadAllText('packaging/macos/RELEASE-NOTES.md')
          if ([regex]::Matches($macTemplate, [regex]::Escape('{{MACOS_VERSION}}')).Count -ne 1 -or
              -not $macTemplate.Contains('macOS downloads / macOS 下载') -or
              -not $macTemplate.Contains('release_ready=false')) {
            throw "Canonical Mac preview release notes are invalid"
          }
          $renderedNotes += "`n`n" + $macTemplate.Replace('{{MACOS_VERSION}}', $env:RELEASE_VERSION)
          $renderedNotes = $renderedNotes.Replace("`r`n", "`n").TrimEnd([char[]]"`r`n")
          $notesPath = 'build/public/windows-release-notes.md'
          [System.IO.File]::WriteAllText(
            $notesPath,
            $renderedNotes,
            [System.Text.UTF8Encoding]::new($false))
          $release = gh release view $env:RELEASE_VERSION `
            --repo $env:GITHUB_REPOSITORY --json isDraft,tagName | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or -not [bool]$release.isDraft -or
              [string]$release.tagName -cne $env:RELEASE_VERSION) {
            throw "The candidate evidence Draft Release is no longer available"
          }
          if ($env:IS_PRERELEASE -ceq 'false') {
            foreach ($intakeOnly in @('TraverseBoard-signed.exe')) {
              gh release delete-asset $env:RELEASE_VERSION $intakeOnly `
                --repo $env:GITHUB_REPOSITORY --yes
              if ($LASTEXITCODE -ne 0) {
                throw "Stable signing intake asset cleanup failed: $intakeOnly"
              }
            }
          }
          $upload = @("release", "upload", $env:RELEASE_VERSION) + $assets + @(
            "--repo", $env:GITHUB_REPOSITORY, "--clobber"
          )
          & gh @upload
          if ($LASTEXITCODE -ne 0) { throw "Verified release asset upload failed" }
          $inventoryJSON = gh release view $env:RELEASE_VERSION `
            --repo $env:GITHUB_REPOSITORY --json assets
          if ($LASTEXITCODE -ne 0) { throw "Published release asset readback failed" }
          $uploaded = @(($inventoryJSON | ConvertFrom-Json).assets | ForEach-Object {
              [string]$_.name
            })
          $expected = @($assets | ForEach-Object { Split-Path -Leaf $_ })
          $unexpected = @($uploaded | Where-Object { $_ -cnotin $expected })
          $missing = @($expected | Where-Object { $_ -cnotin $uploaded })
          if ($uploaded.Count -ne $expected.Count -or $unexpected.Count -ne 0 -or
              $missing.Count -ne 0) {
            throw "Published release asset inventory differs from the exact public allowlist"
          }
          # Validate documented links against the uploaded draft before making
          # it public. Missing EXE/checksums/either DMG keeps the release private.
          $releaseJSON = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$env:RELEASE_VERSION"
          if ($LASTEXITCODE -ne 0) { throw "Download entry point asset readback failed" }
          [System.IO.File]::WriteAllText('build/public/download-release.json', ($releaseJSON | Out-String), [System.Text.UTF8Encoding]::new($false))
          python -B scripts/check-download-docs.py `
            --version $env:RELEASE_VERSION --revision $macRevision `
            --release-json build/public/download-release.json --allow-draft
          if ($LASTEXITCODE -ne 0) { throw "Public download entry points do not match the release assets" }
          $publish = @(
            "release", "edit", $env:RELEASE_VERSION,
            "--repo", $env:GITHUB_REPOSITORY,
            "--verify-tag", "--draft=false",
            "--title", "Traverse Board Desktop $env:RELEASE_VERSION",
            "--notes-file", $notesPath
          )
          $publish += "--prerelease=${{ needs.portable-zip.outputs.prerelease }}"
          & gh @publish
          if ($LASTEXITCODE -ne 0) { throw "Verified Draft Release publication failed" }
          $publishedJSON = gh release view $env:RELEASE_VERSION `
            --repo $env:GITHUB_REPOSITORY `
            --json body,isDraft,isPrerelease,tagName
          if ($LASTEXITCODE -ne 0) { throw "Published release body readback failed" }
          $published = $publishedJSON | ConvertFrom-Json
          $publishedBody = ([string]$published.body).Replace("`r`n", "`n")
          $publishedBody = $publishedBody.Replace("`r", "`n").TrimEnd([char[]]"`r`n")
          $expectedPrerelease = $env:IS_PRERELEASE -ceq 'true'
          if ([string]$published.tagName -cne $env:RELEASE_VERSION -or
              [bool]$published.isDraft -or
              [bool]$published.isPrerelease -ne $expectedPrerelease -or
              $publishedBody -cne $renderedNotes) {
            throw "Published release metadata or canonical bilingual body differs after readback"
          }
